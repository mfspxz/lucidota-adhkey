[package]
name = "adhkey-flailer"
version = "0.1.0"
edition = "2021"
description = "AdhKey flailer recovery: self-vouching for total device loss"
license = "MIT OR Apache-2.0"

[dependencies]
chacha20poly1305 = "0.10"
argon2 = "0.5"
sha2 = "0.10"
hkdf = "0.12"
blahaj = "0.6"
getrandom = "0.2"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
