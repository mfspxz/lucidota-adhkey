[package]
name = "adhkey-core"
version = "0.2.0"
edition = "2021"
description = "AdhKey core: identity/key-lifecycle protocol types and state machine. No crypto here."
license = "MIT OR Apache-2.0"

[dependencies]
organelle-host = { path = "../../../organelles/crates/organelle-host" }
organelle-manifest = { path = "../../../organelles/crates/organelle-manifest" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
adhkey-crypto = { path = "../adhkey-crypto" }
